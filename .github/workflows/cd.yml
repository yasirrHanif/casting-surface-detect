name: Defect Detection API CD

on:
  push:
    branches:
      - main


jobs:

  docker-build:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout code
      uses: actions/checkout@v4


    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/defect-detection-api:latest .


    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/defect-detection-api:latest